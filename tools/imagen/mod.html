<!doctype html>

      --hide-scrollbars --force-device-scale-factor=1 --window-size=1920,1080

<html><head><meta charset="utf-8"><title>mod image</title>
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#120d0a}
  .t{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif}
</style></head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="0.55" stop-color="#1f160f"/>
      <stop offset="1" stop-color="#0b0806"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#e8b94a"/>
      <stop offset="1" stop-color="#9a6a1c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f6fb8"/><stop offset="1" stop-color="#1b335f"/>
    </linearGradient>
    <linearGradient id="red" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0453a"/><stop offset="1" stop-color="#5f1a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/><circle cx="1" cy="1" r="0.6" fill="#fff" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grain)"/>
  <!-- marco -->
  <rect x="40" y="40" width="1840" height="1000" fill="none" stroke="#c9a14a" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="56" y="56" width="1808" height="968" fill="none" stroke="#c9a14a" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- brillo central -->
  <circle cx="960" cy="420" r="430" fill="url(#glow)"/>

  <!-- estandartes -->
  <g filter="url(#shadow)">
    <g transform="translate(560,170)">
      <rect x="-6" y="-30" width="12" height="520" fill="#6b4a22"/>
      <circle cx="0" cy="-36" r="14" fill="url(#gold)"/>
      <path d="M6 0 H250 V330 L128 400 L6 330 Z" fill="url(#blue)" stroke="#e8b94a" stroke-width="5"/>
      <path d="M128 90 L168 170 L128 250 L88 170 Z" fill="#e8b94a" opacity="0.9"/>
    </g>
    <g transform="translate(1360,170) scale(-1,1)">
      <rect x="-6" y="-30" width="12" height="520" fill="#6b4a22"/>
      <circle cx="0" cy="-36" r="14" fill="url(#gold)"/>
      <path d="M6 0 H250 V330 L128 400 L6 330 Z" fill="url(#red)" stroke="#e8b94a" stroke-width="5"/>
      <path d="M128 100 a60 60 0 1 0 0.1 0 Z" fill="none" stroke="#e8b94a" stroke-width="16" opacity="0.9"/>
    </g>
  </g>

  <!-- cofre/reserva común en el centro -->
  <g filter="url(#shadow)" transform="translate(960,430)">
    <rect x="-150" y="-40" width="300" height="160" rx="12" fill="#5a3818" stroke="#e8b94a" stroke-width="6"/>
    <path d="M-150 -40 Q0 -170 150 -40 Z" fill="#6e4520" stroke="#e8b94a" stroke-width="6"/>
    <rect x="-150" y="10" width="300" height="16" fill="#e8b94a" opacity="0.85"/>
    <rect x="-24" y="-10" width="48" height="64" rx="8" fill="url(#gold)" stroke="#5a3818" stroke-width="4"/>
    <circle cx="0" cy="16" r="7" fill="#3b2410"/>
    <!-- monedas que asoman -->
    <ellipse cx="-70" cy="-58" rx="34" ry="12" fill="url(#gold)"/>
    <ellipse cx="-20" cy="-72" rx="34" ry="12" fill="url(#gold)"/>
    <ellipse cx="40" cy="-64" rx="34" ry="12" fill="url(#gold)"/>
  </g>

  <!-- flechas de flujo hacia la reserva -->
  <g fill="none" stroke="#e8b94a" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <path d="M760 520 Q820 560 860 530"/>
    <path d="M1160 520 Q1100 560 1060 530"/>
  </g>
  <path d="M850 512 l28 14 l-30 14 z" fill="#e8b94a" opacity="0.85"/>
  <path d="M1070 512 l-28 14 l30 14 z" fill="#e8b94a" opacity="0.85"/>

  <!-- iconos de recursos -->
  <g transform="translate(960,720)" filter="url(#shadow)">
    <!-- comida: pierna -->
    <g transform="translate(-390,0)">
      <circle r="62" fill="#2a1d12" stroke="#c9a14a" stroke-width="4"/>
      <ellipse cx="8" cy="-6" rx="34" ry="26" fill="#c2552f" transform="rotate(-35)"/>
      <rect x="-34" y="18" width="34" height="11" rx="5" fill="#f1e2c4" transform="rotate(-35)"/>
      <circle cx="-38" cy="40" r="9" fill="#f1e2c4"/><circle cx="-28" cy="47" r="9" fill="#f1e2c4"/>
    </g>
    <!-- madera: troncos -->
    <g transform="translate(-130,0)">
      <circle r="62" fill="#2a1d12" stroke="#c9a14a" stroke-width="4"/>
      <rect x="-40" y="-2" width="80" height="26" rx="13" fill="#8a5a2b"/>
      <rect x="-40" y="-30" width="80" height="26" rx="13" fill="#9c6a35"/>
      <circle cx="40" cy="11" r="13" fill="#d8a96a"/><circle cx="40" cy="-17" r="13" fill="#e2b87c"/>
      <circle cx="40" cy="11" r="5" fill="#8a5a2b"/><circle cx="40" cy="-17" r="5" fill="#9c6a35"/>
    </g>
    <!-- oro: monedas -->
    <g transform="translate(130,0)">
      <circle r="62" fill="#2a1d12" stroke="#c9a14a" stroke-width="4"/>
      <ellipse cx="-10" cy="22" rx="32" ry="11" fill="#9a6a1c"/>
      <ellipse cx="-10" cy="14" rx="32" ry="11" fill="url(#gold)"/>
      <ellipse cx="6" cy="0" rx="32" ry="11" fill="#9a6a1c"/>
      <ellipse cx="6" cy="-8" rx="32" ry="11" fill="url(#gold)"/>
      <ellipse cx="-4" cy="-24" rx="32" ry="11" fill="#9a6a1c"/>
      <ellipse cx="-4" cy="-32" rx="32" ry="11" fill="url(#gold)"/>
    </g>
    <!-- piedra: bloques -->
    <g transform="translate(390,0)">
      <circle r="62" fill="#2a1d12" stroke="#c9a14a" stroke-width="4"/>
      <path d="M-40 30 L-30 -2 L4 -8 L14 26 Z" fill="#9aa0a6"/>
      <path d="M2 28 L10 -14 L40 -6 L42 28 Z" fill="#7f868d"/>
      <path d="M-22 -4 L-12 -36 L22 -38 L18 -8 Z" fill="#b6bcc1"/>
    </g>
  </g>

  <!-- candado pequeño (bloqueo) -->
  <g transform="translate(1440,690)" opacity="0.95" filter="url(#shadow)">
    <path d="M-22 0 V-22 a22 22 0 0 1 44 0 V0" fill="none" stroke="#c9a14a" stroke-width="9"/>
    <rect x="-34" y="-4" width="68" height="54" rx="8" fill="url(#gold)"/>
    <circle cx="0" cy="18" r="7" fill="#5a3818"/><rect x="-3" y="20" width="6" height="16" fill="#5a3818"/>
  </g>

  <!-- título -->
  <text class="t" x="960" y="905" text-anchor="middle" font-size="128" font-weight="bold"
        fill="url(#gold)" stroke="#2a1708" stroke-width="3" letter-spacing="10" filter="url(#shadow)">SHARED RESOURCES</text>
  <text class="t" x="960" y="975" text-anchor="middle" font-size="40" fill="#f1e2c4" opacity="0.9" letter-spacing="3">

</body></html>
